<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<!--SEO-->
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap">
<link rel="preload" href="/css/style.css" as="style">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>
<a class="skip" href="#app">Pular para o conteúdo</a>
<div class="topbar"><div class="wrap"><span id="topbar-msg">Pix com desconto • Parcele em até 12x • Enviamos para o mundo todo</span></div></div>
<header class="header" id="header">
  <div class="wrap header-row">
    <button class="icon-btn burger" data-action="menu-open" aria-label="Abrir menu"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <a href="/" class="logo" aria-label="Sport Imperativo Store"><img src="/img/logo.png" alt="Sport Imperativo Store" width="186" height="52"></a>
    <form class="search" id="search-form" role="search" autocomplete="off">
      <svg viewBox="0 0 24 24" class="s-ico"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search-input" type="search" placeholder="Busque por time, jogador, produto ou categoria..." aria-label="Buscar" enterkeyhint="search">
      <div class="suggest" id="suggest" hidden></div>
    </form>
    <nav class="actions" aria-label="Ações">
      <a href="/conta" class="icon-btn" aria-label="Minha conta" id="acc-link"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg><span class="lbl">Entrar</span></a>
      <a href="/favoritos" class="icon-btn" aria-label="Favoritos"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 018-3 4.6 4.6 0 018 3c0 5.8-8 11-8 11z"/></svg><span class="lbl">Favoritos</span></a>
      <button class="icon-btn cart-btn" data-action="cart-open" aria-label="Carrinho"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11h10.2L20 8H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg><span class="lbl">Carrinho</span><b class="badge-count" id="cart-count" hidden>0</b></button>
    </nav>
  </div>
  <nav class="mainnav" id="mainnav" aria-label="Categorias"><div class="wrap"><ul id="nav-list"></ul></div>
    <div class="mega" id="mega" hidden></div>
  </nav>
</header>

<div class="drawer-bg" id="drawer-bg" hidden></div>
<aside class="drawer left" id="menu-drawer" hidden aria-label="Menu"></aside>
<aside class="drawer right" id="cart-drawer" hidden aria-label="Carrinho"></aside>

<main id="app" tabindex="-1"><div class="wrap"><div class="skeleton" style="height:320px;margin-top:24px"></div></div></main>

<footer class="footer" id="footer"></footer>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-bg" id="modal" hidden></div>
<div class="cookie" id="cookie" hidden></div>
<a class="wa-float" id="wa-float" hidden target="_blank" rel="noopener" aria-label="Falar no WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 00-7.8 13.5L3 21l4.6-1.2A9 9 0 1012 3z"/><path d="M8.5 9c.5 3 2.5 5 5.5 6l1.5-1.5-2-1-1 .6c-.8-.4-1.600-1.200-2-2l.6-1-1-2z"/></svg></a>
<script type="module" src="/js/app.js"></script>
<noscript><p style="padding:24px">Ative o JavaScript para usar a loja.</p></noscript>
</body>
</html>
